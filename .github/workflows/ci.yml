name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and package (JavaFX virtual display)
        run: xvfb-run -a ./gradlew clean build --no-daemon
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/test-results/test/
          if-no-files-found: warn
